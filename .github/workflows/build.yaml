name: Build Kernel for A51

on:
  workflow_dispatch:  # Manual trigger for the workflow

jobs:
  build:
    runs-on: ubuntu-22.04  # Set the OS environment to Ubuntu 22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v3  # Checkout the repository code

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bash git make libssl-dev curl bc pkg-config m4 libtool automake autoconf python3

    - name: Clone the kernel repository
      run: |
        git clone https://github.com/Gojikovi/kernel_samsung_universal9611
        cd kernel_samsung_universal9611

    - name: Install toolchain (WeebX-Clang)
      run: |
        # Download and set up WeebX-Clang toolchain
        curl -L https://github.com/XSans0/WeebX-Clang/releases/download/latest/weebx-clang.tar.xz -o weebx-clang.tar.xz
        tar -xf weebx-clang.tar.xz
        export PATH=$PWD/weebx-clang/bin:$PATH

    - name: Build the kernel
      run: |
        cd kernel_samsung_universal9611
        python3 build_kernel.py --target=a51 --allow-dirty --aosp

    - name: Upload Kernel Artifacts (optional)
      uses: actions/upload-artifact@v3
      with:
        name: kernel-artifacts
        path: ./output_directory # Replace with the actual output directory where the kernel image is stored
